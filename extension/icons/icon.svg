<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background rounded plate for toolbar contrast in dark and light themes -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#090d16" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Shield Shape -->
  <path d="M64 26 L94 38 C94 68 78 88 64 98 C50 88 34 68 34 38 Z" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Lightning Bolt Symbol inside Shield -->
  <path d="M66 42 L52 64 L63 64 L60 82 L76 56 L65 56 Z" fill="url(#boltGrad)" stroke="#065f46" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
